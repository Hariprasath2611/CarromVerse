version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CORS_ORIGIN=*
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: carromverse_postgres
    environment:
      POSTGRES_USER: carrom
      POSTGRES_PASSWORD: carrom_secret_password
      POSTGRES_DB: carromverse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/postgresql/schemas/core_schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: carromverse_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
