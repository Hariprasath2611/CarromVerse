<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 236" width="220" height="236">
  <defs>
    <!-- Face Radial Gradient -->
    <radialGradient id="whiteCoinFaceGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F2E9D4" />
      <stop offset="90%" stop-color="#E8DCBE" />
      <stop offset="100%" stop-color="#E2D6B4" />
    </radialGradient>

    <!-- Ground Shadow Blur Gradient -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Ground Shadow (84x10, 30-40% black) -->
  <ellipse cx="110" cy="224" rx="84" ry="10" fill="url(#shadowGrad)" />

  <!-- 2. Edge-Thickness Disc (r100, 12 units lower) in #A89868 -->
  <circle cx="110" cy="122" r="100" fill="#A89868" />

  <!-- 3. Face Disc (r100) with Radial Gradient #FFFFFF -> #E2D6B4 -->
  <circle cx="110" cy="110" r="100" fill="url(#whiteCoinFaceGrad)" stroke="#CDBF9A" stroke-width="1.5" />

  <!-- 4. Groove Ring r84 (3 units, #CDBF9A) -->
  <circle cx="110" cy="110" r="84" fill="none" stroke="#CDBF9A" stroke-width="3" />

  <!-- 5. Inner Ring r66 (2 units, #CDBF9A) -->
  <circle cx="110" cy="110" r="66" fill="none" stroke="#CDBF9A" stroke-width="2" />

  <!-- 6. Tick Ring (r48, 10-unit stroke dashed 3 / 15.85) -->
  <circle cx="110" cy="110" r="48" fill="none" stroke="#CDBF9A" stroke-width="10" stroke-dasharray="3 15.85" />

  <!-- 7. Center Emblem (r30 disc, r8 dot in #CDBF9A) -->
  <circle cx="110" cy="110" r="30" fill="none" stroke="#CDBF9A" stroke-width="2" />
  <circle cx="110" cy="110" r="8" fill="#CDBF9A" />

  <!-- 8. Highlight Ellipse (center 74, 62; 40x16; rotated -35°; white 55%) -->
  <ellipse cx="74" cy="62" rx="20" ry="8" transform="rotate(-35 74 62)" fill="#FFFFFF" opacity="0.55" />
</svg>
