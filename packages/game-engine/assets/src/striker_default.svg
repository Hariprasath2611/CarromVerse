<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 276" width="260" height="276">
  <defs>
    <!-- Striker Rim Radial Gradient -->
    <radialGradient id="strikerRimGrad" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#5BF0A0" />
      <stop offset="50%" stop-color="#2BD67B" />
      <stop offset="85%" stop-color="#19A35C" />
      <stop offset="100%" stop-color="#138A4C" />
    </radialGradient>

    <!-- Ground Shadow Blur Gradient -->
    <radialGradient id="strikerShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Ground Shadow (104x12, 40% black) -->
  <ellipse cx="130" cy="264" rx="104" ry="12" fill="url(#strikerShadowGrad)" />

  <!-- 2. Edge Thickness Disc (r120, 14 units lower) in #0B6F3C -->
  <circle cx="130" cy="144" r="120" fill="#0B6F3C" />

  <!-- 3. Outer Emerald Rim (r120) with Gradient #5BF0A0 -> #138A4C -->
  <circle cx="130" cy="130" r="120" fill="url(#strikerRimGrad)" stroke="#0B6F3C" stroke-width="2" />

  <!-- 4. Cream Inner Disc (r100) #F5ECD2 -->
  <circle cx="130" cy="130" r="100" fill="#F5ECD2" stroke="#E0D2AF" stroke-width="2" />

  <!-- 5. Ring r84 Emerald 6 units (#2BD67B) -->
  <circle cx="130" cy="130" r="84" fill="none" stroke="#2BD67B" stroke-width="6" />

  <!-- 6. Ring r62 Brass 3 units (#E9B949) -->
  <circle cx="130" cy="130" r="62" fill="none" stroke="#E9B949" stroke-width="3" />

  <!-- 7. Dashed Ring r40 Emerald 2 units (#2BD67B, dashed 4 4) -->
  <circle cx="130" cy="130" r="40" fill="none" stroke="#2BD67B" stroke-width="2" stroke-dasharray="4 4" />

  <!-- 8. Center Brass Dot r12 (#E9B949, stroke #A47A16) -->
  <circle cx="130" cy="130" r="12" fill="#E9B949" stroke="#A47A16" stroke-width="1.5" />

  <!-- 9. Aim Notch: triangle at top (130, 30) in #06210F at 60% opacity (pointing UP forward) -->
  <polygon points="130,16 122,34 138,34" fill="#06210F" opacity="0.60" />

  <!-- 10. Top Highlight: ellipse (86, 74; 46x18; -35°; white 50%) -->
  <ellipse cx="86" cy="74" rx="23" ry="9" transform="rotate(-35 86 74)" fill="#FFFFFF" opacity="0.50" />
</svg>
