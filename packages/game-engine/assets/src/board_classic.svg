<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <!-- Frame Wood Gradient -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0612C" />
      <stop offset="50%" stop-color="#6B3A1A" />
      <stop offset="100%" stop-color="#8B5226" />
    </linearGradient>

    <!-- Faint Vertical Wood Grain Pattern for Frame -->
    <pattern id="frameGrain" width="8" height="640" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="640" stroke="#4A2610" stroke-width="0.75" opacity="0.25" />
      <line x1="6" y1="0" x2="6" y2="640" stroke="#8B5226" stroke-width="0.5" opacity="0.20" />
    </pattern>

    <!-- Playing Surface Grain Pattern -->
    <pattern id="surfaceGrain" width="13" height="528" patternUnits="userSpaceOnUse">
      <line x1="6.5" y1="0" x2="6.5" y2="528" stroke="#B8955A" stroke-width="1" opacity="0.22" />
    </pattern>

    <!-- Pocket Radial Gradient -->
    <radialGradient id="pocketGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="70%" stop-color="#140D0A" />
      <stop offset="90%" stop-color="#241711" />
      <stop offset="100%" stop-color="#2A1B14" />
    </radialGradient>

    <!-- Diagonal Gloss Overlay -->
    <linearGradient id="glossOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Wooden Outer Frame (r30) -->
  <rect x="0" y="0" width="640" height="640" rx="30" ry="30" fill="url(#woodGradient)" />
  <rect x="0" y="0" width="640" height="640" rx="30" ry="30" fill="url(#frameGrain)" />

  <!-- Brass Inlay Line (inset 8, 2 units, 70% opacity) -->
  <rect x="8" y="8" width="624" height="624" rx="22" ry="22" fill="none" stroke="#E9B949" stroke-width="2" opacity="0.70" />

  <!-- Frame Miter Joints at 45 degrees -->
  <line x1="0" y1="0" x2="44" y2="44" stroke="#4A2610" stroke-width="1.5" opacity="0.5" />
  <line x1="640" y1="0" x2="596" y2="44" stroke="#4A2610" stroke-width="1.5" opacity="0.5" />
  <line x1="0" y1="640" x2="44" y2="596" stroke="#4A2610" stroke-width="1.5" opacity="0.5" />
  <line x1="640" y1="640" x2="596" y2="596" stroke="#4A2610" stroke-width="1.5" opacity="0.5" />

  <!-- 2. Inner Cushion Lip Rect 44-596 in #3E2210 -->
  <rect x="44" y="44" width="552" height="552" fill="#3E2210" />

  <!-- 3. Playing Surface 56-584 (528 units square, corner radius 4) in #F0DDB0 -->
  <rect x="56" y="56" width="528" height="528" rx="4" ry="4" fill="#F0DDB0" stroke="#B8955A" stroke-width="2" />
  <!-- Surface Vertical Grain Lines every 13 units at 22% opacity -->
  <rect x="56" y="56" width="528" height="528" rx="4" ry="4" fill="url(#surfaceGrain)" pointer-events="none" />

  <!-- 4. Corner Pockets (visual radius 28 units with 4-unit brass stroke #C9A24B and radial fill) -->
  <!-- Top-Left Pocket (80, 80) -->
  <circle cx="80" cy="80" r="28" fill="url(#pocketGrad)" stroke="#C9A24B" stroke-width="4" />
  <!-- Top-Right Pocket (560, 80) -->
  <circle cx="560" cy="80" r="28" fill="url(#pocketGrad)" stroke="#C9A24B" stroke-width="4" />
  <!-- Bottom-Left Pocket (80, 560) -->
  <circle cx="80" cy="560" r="28" fill="url(#pocketGrad)" stroke="#C9A24B" stroke-width="4" />
  <!-- Bottom-Right Pocket (560, 560) -->
  <circle cx="560" cy="560" r="28" fill="url(#pocketGrad)" stroke="#C9A24B" stroke-width="4" />

  <!-- 5. Diagonal Guides: dashed (6 6) 1.5 units from (118,118)->(224,224) and mirrored -->
  <g stroke="#6B3A1A" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="118" y1="118" x2="224" y2="224" />
    <line x1="522" y1="118" x2="416" y2="224" />
    <line x1="118" y1="522" x2="224" y2="416" />
    <line x1="522" y1="522" x2="416" y2="416" />
  </g>

  <!-- 6. Baselines: four pill outlines (rx 12, stroke 2 #6B3A1A, no fill) -->
  <!-- Top Baseline (x 152-488, y 118-142) -->
  <rect x="152" y="118" width="336" height="24" rx="12" ry="12" fill="none" stroke="#6B3A1A" stroke-width="2" />
  <!-- Bottom Baseline (x 152-488, y 498-522) -->
  <rect x="152" y="498" width="336" height="24" rx="12" ry="12" fill="none" stroke="#6B3A1A" stroke-width="2" />
  <!-- Left Baseline (x 118-142, y 152-488) -->
  <rect x="118" y="152" width="24" height="336" rx="12" ry="12" fill="none" stroke="#6B3A1A" stroke-width="2" />
  <!-- Right Baseline (x 498-522, y 152-488) -->
  <rect x="498" y="152" width="24" height="336" rx="12" ry="12" fill="none" stroke="#6B3A1A" stroke-width="2" />

  <!-- Red End Markers r8 at pill circle centers -->
  <!-- Top Markers: (164, 130) and (476, 130) -->
  <circle cx="164" cy="130" r="8" fill="#D8344A" />
  <circle cx="476" cy="130" r="8" fill="#D8344A" />
  <!-- Bottom Markers: (164, 510) and (476, 510) -->
  <circle cx="164" cy="510" r="8" fill="#D8344A" />
  <circle cx="476" cy="510" r="8" fill="#D8344A" />
  <!-- Left Markers: (130, 164) and (130, 476) -->
  <circle cx="130" cy="164" r="8" fill="#D8344A" />
  <circle cx="130" cy="476" r="8" fill="#D8344A" />
  <!-- Right Markers: (510, 164) and (510, 476) -->
  <circle cx="510" cy="164" r="8" fill="#D8344A" />
  <circle cx="510" cy="476" r="8" fill="#D8344A" />

  <!-- 7. Center Circles and Emblems (center at 320, 320) -->
  <!-- Outer Green Circle r86 stroke 3 #1E8F5A -->
  <circle cx="320" cy="320" r="86" fill="none" stroke="#1E8F5A" stroke-width="3" />
  <!-- Red Circle r62 stroke 2 #D8344A -->
  <circle cx="320" cy="320" r="62" fill="none" stroke="#D8344A" stroke-width="2" />
  <!-- Dashed Green Circle r40 stroke 1.5 #1E8F5A (dashed 4/4) -->
  <circle cx="320" cy="320" r="40" fill="none" stroke="#1E8F5A" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Four Red Petals (ellipses 7x16) at +-50 units -->
  <!-- Top Petal (320, 270) -->
  <ellipse cx="320" cy="270" rx="7" ry="16" fill="#D8344A" />
  <!-- Bottom Petal (320, 370) -->
  <ellipse cx="320" cy="370" rx="7" ry="16" fill="#D8344A" />
  <!-- Left Petal (270, 320) -->
  <ellipse cx="270" cy="320" rx="16" ry="7" fill="#D8344A" />
  <!-- Right Petal (370, 320) -->
  <ellipse cx="370" cy="320" rx="16" ry="7" fill="#D8344A" />

  <!-- Inner Green Ring r18 stroke 2 #1E8F5A -->
  <circle cx="320" cy="320" r="18" fill="none" stroke="#1E8F5A" stroke-width="2" />
  <!-- Center Red Dot r10 #D8344A -->
  <circle cx="320" cy="320" r="10" fill="#D8344A" />

  <!-- 8. Finish: Diagonal White Gloss Overlay (22% -> 0%) -->
  <rect x="0" y="0" width="640" height="640" rx="30" ry="30" fill="url(#glossOverlay)" pointer-events="none" />
</svg>
